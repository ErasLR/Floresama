<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Flores para ti 🌻</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Pétalos que caen por toda la página -->
    <div id="petalos"></div>


    <!-- =========================
         PANTALLA DE INICIO
    ========================== -->
    <section id="inicio" class="pantalla activa">

        <div class="inicio-contenido">

            <div class="flor-intro">

                <div class="intro-centro"></div>

                <span style="--i:0"></span>
                <span style="--i:1"></span>
                <span style="--i:2"></span>
                <span style="--i:3"></span>
                <span style="--i:4"></span>
                <span style="--i:5"></span>
                <span style="--i:6"></span>
                <span style="--i:7"></span>

            </div>

            <h1>Unas flores para ti Michel 🌻</h1>

            <p>
            ...
            </p>

            <button id="comenzar">
                Abrir mi regalo 💛
            </button>

        </div>

    </section>


    <!-- =========================
         PANTALLA DEL RAMO
    ========================== -->
    <section id="regalo" class="pantalla">

        <div class="regalo-contenido">

            <div class="ramo">

                <!-- Tallos -->
                <div class="tallo tallo1"></div>
                <div class="tallo tallo2"></div>
                <div class="tallo tallo3"></div>
                <div class="tallo tallo4"></div>
                <div class="tallo tallo5"></div>
                <div class="tallo tallo6"></div>
                <div class="tallo tallo7"></div>


                <!-- Hojas -->
                <div class="hoja hoja1"></div>
                <div class="hoja hoja2"></div>
                <div class="hoja hoja3"></div>
                <div class="hoja hoja4"></div>


                <!-- Flor 1 -->
                <div class="flor flor1">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <div class="centro-flor"></div>
                </div>


                <!-- Flor 2 -->
                <div class="flor flor2">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <div class="centro-flor"></div>
                </div>


                <!-- Flor 3 -->
                <div class="flor flor3">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <div class="centro-flor"></div>
                </div>


                <!-- Flor 4 -->
                <div class="flor flor4">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <div class="centro-flor"></div>
                </div>


                <!-- Flor 5 -->
                <div class="flor flor5">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <div class="centro-flor"></div>
                </div>


                <!-- Flor 6 -->
                <div class="flor flor6">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <div class="centro-flor"></div>
                </div>


                <!-- Flor 7 -->
                <div class="flor flor7">
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <span></span><span></span><span></span><span></span>
                    <div class="centro-flor"></div>
                </div>

            </div>


            <!-- Mensaje -->
            <div class="mensaje">

                <h2>Flores para ti 🌻</h2>

                <p>
                    No hace falta una fecha especial
                    para regalarte algo bonito.
                </p>

                <p>
                    Estas flores son para ti
                </p>

                <button id="mostrarMensaje">
                    Tengo algo más que decirte...
                </button>

            </div>

        </div>

    </section>


    <!-- =========================
         PANTALLA FINAL
    ========================== -->
    <section id="final" class="pantalla">

        <div class="carta">

            <div class="flor-carta">
                🌻
            </div>

            <h2>Para ti 💛</h2>

            <p>
                Solo quería recordarte lo especial
                que eres para mí.
            </p>

            <p>
               Te amo mi amor 
            </p>

            <div class="corazon-final">
                💛
            </div>

            <div class="firma">
                Con mucho cariño ❤️
            </div>

            <button id="volver">
                Volver a ver las flores 🌻
            </button>

        </div>

    </section>


    <!-- Música -->
    <audio id="musica" loop>
        <source src="assets/musica.mp3" type="audio/mpeg">
    </audio>


    <script src="script.js"></script>

</body>

</html>
